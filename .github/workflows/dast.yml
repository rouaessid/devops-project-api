name: DAST Security Scan 🕵️

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan OWASP ZAP

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Firebase Key File
        run: echo '${{ secrets.FIREBASE_KEY }}' > firebase-key.json

      - name: Build Container
        run: docker build -t test-api-dast .

      - name: Run Container
        run: |
          # On lance le conteneur
          docker run -d --network host --name test-api-dast test-api-dast
          echo "⏳ Démarrage de l'API..."
          sleep 10
      
      # J'ajoute cette étape pour vérifier que l'API répond avant de scanner
      - name: Check API Status
        run: curl -v http://localhost:8000/docs || echo "⚠️ L'API ne répond pas sur /docs"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
        
          target: 'http://localhost:8000/docs' 
         
          cmd_options: '-a' 
          fail_action: false 
          allow_issue_writing: false