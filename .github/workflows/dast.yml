name: DAST Security Scan 🕵️

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan OWASP ZAP

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Firebase Key File
        run: echo '${{ secrets.FIREBASE_KEY }}' > firebase-key.json

      - name: Build Container
        run: docker build -t test-api-dast .

      - name: Run Container
        run: |
          docker run -d --network host --name test-api-dast test-api-dast
          echo "Waiting for API to start..."
          sleep 10

      - name: Check API Status
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/docs)
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ API is not responding at /docs (status $STATUS)"
          else
            echo " API is up"
          fi

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          target: http://localhost:8000/docs
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false

      # Upload reports as artifacts
      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v3
        with:
          name: zap-scan-report   #  Nom valide
          path: |
            report_json.json
            report_md.md
            report_html.html
