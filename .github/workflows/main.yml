name: CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/ci-cd" ]
  pull_request:
    branches: [ main ]

jobs:
  # --- JOB 1 : QUALITÉ & SÉCURITÉ (CI + SAST) ---
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupération du code
        uses: actions/checkout@v3

      - name: 2. Installation de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Injection de la clé Firebase (Secrète)
        run: echo '${{ secrets.FIREBASE_KEY }}' > firebase-key.json

      - name: 5. Linting (Qualité du code - Flake8)
        run: |
          # Stop s'il y a des erreurs graves
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertissements pour le style (ne bloque pas)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 6. Tests Unitaires (Pytest)
        run: pytest

      - name: 7. Sécurité SAST (Bandit)
        # Scanne le dossier app pour trouver des failles
        run: bandit -r app/ -f json -o bandit-report.json || true

  # --- JOB 2 : LIVRAISON DOCKER (CD) ---
  build-and-push-docker:
    needs: test-and-security
    runs-on: ubuntu-latest
   
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3

      - name: Injection de la clé Firebase
        run: echo '${{ secrets.FIREBASE_KEY }}' > firebase-key.json

      - name: Login à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build et Push de l'image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-project-api:latest